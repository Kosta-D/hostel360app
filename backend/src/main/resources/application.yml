spring:
  application.name: hostel360
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/hostel360}
    username: ${DB_USER:hostel360}
    password: ${DB_PASSWORD:hostel360}
  jpa:
    open-in-view: false
    hibernate.ddl-auto: validate
  mvc.problemdetails.enabled: true
  servlet.multipart:
    max-file-size: 10MB
    max-request-size: 10MB

app:
  auth:
    username: ${ADMIN_USERNAME:admin}
    password: ${ADMIN_PASSWORD:admin}
    jwt-secret: ${JWT_SECRET:change-me-in-production-at-least-32-chars}
    token-ttl: 12h

management.endpoints.web.exposure.include: health
